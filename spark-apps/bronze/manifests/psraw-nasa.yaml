apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: bronze-ps-spark-app
  namespace: de
spec:
  type: Scala
  mode: cluster
  image: "192.168.0.9:32000/silver-haumea:1.0.0"
  imagePullPolicy: IfNotPresent
  mainClass: "com.haumea.pipelines.PSRawNasa"
  mainApplicationFile: "s3a://pipelines/bronze/haumea/spark-bronze-assembly-0.1.0.jar"
  sparkVersion: "3.5.1"
  sparkConf:
    "spark.sql.shuffle.partitions": "2"
    "spark.sql.parquet.enableVectorizedReader": "false"
    "spark.sql.parquet.validateSchema": "false"

    # Iceberg configuration
    "spark.sql.extensions": "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
    "spark.sql.catalog.lakehouse": "org.apache.iceberg.spark.SparkCatalog"
    "spark.sql.catalog.lakehouse.type": "jdbc"
    "spark.sql.catalog.lakehouse.uri": "jdbc:postgresql://postgres-postgresql.platform.svc.cluster.local:5432/iceberg_db"
    "spark.sql.catalog.lakehouse.jdbc.user": "platform"
    "spark.sql.catalog.lakehouse.jdbc.password": "changeme123"
    "spark.sql.catalog.lakehouse.warehouse": "s3a://gaia-source/"
    "spark.sql.catalog.lakehouse.io-impl": "org.apache.iceberg.aws.s3.S3FileIO"

    # S3FILEIO configuration
    "spark.sql.catalog.lakehouse.s3.endpoint": "http://minio.platform:9000"
    "spark.sql.catalog.lakehouse.s3.path-style-access": "true"
    "spark.sql.catalog.lakehouse.client.region": "us-east-1"

  
  hadoopConf:
    "fs.s3a.aws.credentials.provider": "com.amazonaws.auth.EnvironmentVariableCredentialsProvider"
    "fs.s3a.endpoint": "http://minio.platform:9000"
    "fs.s3a.path.style.access": "true"
    "fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "fs.s3a.connection.ssl.enabled": "false"

  driver:
    cores: 1
    coreLimit: "1000m"
    memory: "1024m"
    nodeSelector:
      kubernetes.io/hostname: "stivnix"
    serviceAccount: spark
    env:
    - name: AWS_REGION
      value: "us-east-1"
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: s3-credentials
          key: accessKey
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: s3-credentials
          key: secretKey
  executor:
    cores: 1
    instances: 1
    memory: "4096m"
    memoryOverhead: "2048m"
    nodeSelector:
      kubernetes.io/hostname: "nixos"
    env:
    - name: AWS_REGION
      value: "us-east-1"
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: s3-credentials
          key: accessKey
    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: s3-credentials
          key: secretKey

