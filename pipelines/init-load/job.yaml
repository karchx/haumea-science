apiVersion: batch/v1
kind: Job
metadata:
  name: init-load-gaia
  namespace: de
spec:
  template:
    spec:
      containers:
      - name: init-load-gaia
        image: 192.168.0.9:32000/init-load-haumea:1.2.0
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: starexoplanet-credentials
              key: AWS_ACCESS_KEY
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: starexoplanet-credentials
              key: AWS_SECRET_KEY
      restartPolicy: Never
