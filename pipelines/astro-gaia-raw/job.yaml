apiVersion: batch/v1
kind: Job
metadata:
  name: astro-gaia-raw
  namespace: de
spec:
  template:
    spec:
      containers:
      - name: astroraw
        image: 192.168.0.9:32000/astro-gaia-raw:1.0.6
        imagePullPolicy: IfNotPresent
        env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: starexoplanet-credentials
              key: AWS_ACCESS_KEY
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: starexoplanet-credentials
              key: AWS_SECRET_KEY
      restartPolicy: Never
